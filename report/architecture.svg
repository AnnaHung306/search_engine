<line x1="1095" y1="195" x2="1095" y2="233" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<!-- row 2: online -->
<text x="30" y="335" font-size="13" fill="#888">ONLINE (every query)</text>
<rect x="30" y="350" width="190" height="110" rx="10" fill="#eafaf0" stroke="#2c9a55"/>
<text x="125" y="378" text-anchor="middle" font-weight="bold">User (browser)</text>
<text x="125" y="402" text-anchor="middle" font-size="12">"sql injection tool"</text>
<text x="125" y="420" text-anchor="middle" font-size="12">"port scan" -metasploit</text>
<rect x="270" y="350" width="230" height="110" rx="10" fill="#eafaf0" stroke="#2c9a55"/>
<text x="385" y="378" text-anchor="middle" font-weight="bold">app.py (Flask)</text>
<text x="385" y="402" text-anchor="middle" font-size="12">search box, ranker toggle</text>
<text x="385" y="420" text-anchor="middle" font-size="12">title, URL, snippet, score</text>
<text x="385" y="438" text-anchor="middle" font-size="12">#indexed pages, time (ms)</text>
<text x="385" y="456" text-anchor="middle" font-size="12">"did you mean" line</text>
<rect x="550" y="350" width="420" height="178" rx="10" fill="#eafaf0" stroke="#2c9a55"/>
<text x="760" y="378" text-anchor="middle" font-weight="bold">search.py</text>
<text x="760" y="401" text-anchor="middle" font-size="12">parse: "phrase", +must, -not  -&gt;  same tokenizer as docs</text>
<text x="760" y="420" text-anchor="middle" font-size="12">candidates = union of postings of query terms</text>
<text x="760" y="439" text-anchor="middle" font-size="12">rank: TF-IDF cosine (required)  |  BM25 (bonus)</text>
<text x="760" y="458" text-anchor="middle" font-size="12">TF-IDF options: pivoted norm, more-query-words-first</text>
<text x="760" y="477" text-anchor="middle" font-size="12">optional: title boost, synonyms, typo/pinyin fix (fuzzy.py)</text>
<text x="760" y="496" text-anchor="middle" font-size="12">hub pages skipped; top-10 with score &gt; 0</text>
<text x="760" y="515" text-anchor="middle" font-size="12">snippet bold + matched / missing words</text>
