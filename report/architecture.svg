<text x="600" y="34" text-anchor="middle" font-size="22" font-weight="bold">Pentest Tool Search - System Architecture</text>
<!-- row 1: offline -->
<text x="30" y="72" font-size="13" fill="#888">OFFLINE (build once)</text>
<rect x="30" y="85" width="190" height="110" rx="10" fill="#eef4ff" stroke="#3b6fd8"/>
<text x="125" y="104" text-anchor="middle" font-weight="bold">8 seeds, 7 sites</text>
<text x="125" y="122" text-anchor="middle" font-size="11">kali.org · nmap.org/book</text>
<text x="125" y="137" text-anchor="middle" font-size="11">docs.metasploit.com</text>
<text x="125" y="152" text-anchor="middle" font-size="11">wireshark.org (user guide)</text>
<text x="125" y="167" text-anchor="middle" font-size="11">docs.mitmproxy.org</text>
<text x="125" y="182" text-anchor="middle" font-size="11">frida.re · gtfobins.org</text>
<rect x="270" y="85" width="230" height="110" rx="10" fill="#eef4ff" stroke="#3b6fd8"/>
<text x="385" y="110" text-anchor="middle" font-weight="bold">crawler.py</text>
<text x="385" y="133" text-anchor="middle" font-size="12">allowlist + path rules + caps</text>
<text x="385" y="151" text-anchor="middle" font-size="12">robots.txt, UA, 2 s / host</text>
<text x="385" y="169" text-anchor="middle" font-size="12">timeout 10 s, 429 back-off</text>
<text x="385" y="187" text-anchor="middle" font-size="12">URL normalize, checkpoint</text>
<rect x="550" y="85" width="200" height="110" rx="10" fill="#fff6e0" stroke="#d89b3b"/>
<text x="650" y="110" text-anchor="middle" font-weight="bold">data/</text>
<text x="650" y="133" text-anchor="middle" font-size="12">pages.json (980 pages)</text>
<text x="650" y="151" text-anchor="middle" font-size="12">{url,title,text,fetch_time}</text>
<text x="650" y="169" text-anchor="middle" font-size="12">crawl_log.jsonl</text>
<text x="650" y="187" text-anchor="middle" font-size="12">crawl_summary.json</text>
<rect x="800" y="85" width="170" height="110" rx="10" fill="#eef4ff" stroke="#3b6fd8"/>
<text x="885" y="110" text-anchor="middle" font-weight="bold">preprocess.py</text>
<text x="885" y="135" text-anchor="middle" font-size="12">lowercase, tokenize</text>
<text x="885" y="153" text-anchor="middle" font-size="12">keep c++ / 802.11</text>
<text x="885" y="171" text-anchor="middle" font-size="12">stopwords, light stem</text>
<rect x="1010" y="85" width="170" height="110" rx="10" fill="#eef4ff" stroke="#3b6fd8"/>
<text x="1095" y="110" text-anchor="middle" font-weight="bold">indexer.py</text>
<text x="1095" y="135" text-anchor="middle" font-size="12">postings term-&gt;{doc:tf}</text>
<text x="1095" y="153" text-anchor="middle" font-size="12">df, idf, doc norms</text>
<text x="1095" y="171" text-anchor="middle" font-size="12">doc length (BM25)</text>
<text x="1095" y="189" text-anchor="middle" font-size="12">clean.py: boilerplate, hubs</text>
